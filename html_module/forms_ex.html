<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width = device-width, initial-scale=1.0">
        <title>Elecciones</title>
    </head>
    <body>
        <h1>Elecciones</h1>
        <main>
            <form action="welcome.html">
                <legend>Seleccione su nombre</legend>
                <br/>
                <!--Opciones-->
                <input type="radio" id="candidato1" name="candidato">
                <label for="candidato1">Candidato #1</label><br/>

                <input type="radio" id="candidato2" name="candidato">
                <label for="candidato2">Candidato #2</label><br/>

                <input type="radio" id="candidato3" name="candidato">
                <label for="candidato3">Candidato #3</label><br/>
                <br/>

                <label for="mail">Correo</label><br/>
                <input type="text" id="mail_field" name="mail"><br/>
                
                <label for="id_number">Numero de identificacion</label><br/>
                <input type="text" id="id_field" name="idNumber"><br/>
                
                <label for="phone_number">Telefono</label><br/>
                <input type="text" id="phone_number_field" name="phoneNumber"><br/>
                <br/>
                <button type="submit">Registrarse</button>
            </form>
        </main>
    </body>
</html>
